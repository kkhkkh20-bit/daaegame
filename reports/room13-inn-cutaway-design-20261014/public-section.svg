<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760"><rect width="100%" height="100%" fill="#101f29"/><style>text{font-family:sans-serif;fill:#f6edd8}.s{font-size:21px}.t{font-size:28px;font-weight:bold}</style><text x="40" y="50" class="t">공개 안내도 제작 방향 · 층 구성 도식</text><text x="40" y="86" class="s">0.17.10 기준 / 검토용 배치 · 실측도 아님 / 알려진 공개 공간만 표시</text>
<g id="hall"><rect x="360" y="145" width="360" height="115" fill="#20343e" stroke="#80c5bd" stroke-width="3"/><text x="378" y="185" class="t">2층 복도</text><text x="378" y="223" class="s">공용계단과 객실 정문</text></g>
<g id="room13"><rect x="850" y="145" width="370" height="115" fill="#20343e" stroke="#80c5bd" stroke-width="3"/><text x="868" y="185" class="t">13호실</text><text x="868" y="223" class="s">방을 받은 뒤 표시</text></g>
<g id="guestroom"><rect x="40" y="145" width="250" height="115" fill="#20343e" stroke="#80c5bd" stroke-width="3"/><text x="58" y="185" class="t">임시 객실</text><text x="58" y="223" class="s">허용된 뒤에만 표시</text></g>
<polyline points="290,205 360,205" fill="none" stroke="#80c5bd" stroke-width="4"/>
<polyline points="720,205 850,205" fill="none" stroke="#80c5bd" stroke-width="4"/>
<g id="inn"><rect x="40" y="435" width="290" height="125" fill="#20343e" stroke="#80c5bd" stroke-width="3"/><text x="58" y="475" class="t">접수대</text><text x="58" y="513" class="s">여관 출입 / 공용계단</text></g>
<g id="dining"><rect x="440" y="435" width="300" height="125" fill="#20343e" stroke="#80c5bd" stroke-width="3"/><text x="458" y="475" class="t">식당</text><text x="458" y="513" class="s">주민의 공개 활동</text></g>
<g id="kitchen"><rect x="900" y="435" width="320" height="125" fill="#20343e" stroke="#80c5bd" stroke-width="3"/><text x="918" y="475" class="t">주방</text><text x="918" y="513" class="s">알려진 작업 공간</text></g>
<polyline points="330,495 440,495" fill="none" stroke="#80c5bd" stroke-width="4"/>
<polyline points="740,495 900,495" fill="none" stroke="#80c5bd" stroke-width="4"/>
<polyline points="185,435 185,330 540,330 540,260" fill="none" stroke="#80c5bd" stroke-width="4"/>
<text x="320" y="317" class="s">공용계단 · 연결만 표시, 실제 위치/형상은 원화 대조 후 확정</text>
<text x="40" y="625" class="s">숨은 공간의 윤곽·계단·배선·범인 동선은 기본 지도에 넣지 않는다.</text>
<text x="40" y="665" class="s">공개 장소도 현재 플레이에서 허용된 장소만 표시한다. 표시만으로 이동·발견이 발생하지 않는다.</text>
<text x="40" y="705" class="s">이 시트는 최종 도트 원화가 아니다. 방 크기·방향·층고를 확정하지 않는다.</text>
</svg>