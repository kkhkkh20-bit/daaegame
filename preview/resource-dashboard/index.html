<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>다람탐정 · 리소스 도감</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="viewer.css"><script src="viewer.js" defer></script><script src="app.js?v=03fbaf57f9128022" defer></script></head><body>
<header><div class="brand">다람탐정 <span>RESOURCE ATLAS</span></div><h1>게임을 이루는 얼굴과 소리</h1><p>인물의 표정과 등장 장소, 마을에 흐르는 소리를 살펴보세요.</p><div class="version"><span id="version">데이터를 불러오는 중…</span><button id="refresh">새 버전 확인</button></div><div id="build-info"></div><p class="notice">읽기 전용 도감입니다. 그림 선택 보드와 별개이며, 실제 등장은 이야기 진행과 상황에 따라 달라질 수 있어요.</p></header>
<main><nav aria-label="리소스 종류"><button data-tab="characters" aria-pressed="true">캐릭터</button><button data-tab="places" aria-pressed="false">장소별 배치</button><button data-tab="audio" aria-pressed="false">음향</button><button data-tab="audit" aria-pressed="false">연결 점검</button></nav>
<section class="filters" aria-label="필터"><label>검색<input id="query" type="search" placeholder="이름, 장소, 동작, 소리"></label><label>장소<select id="place"><option value="">전체 장소</option></select></label><label>연결 상태<select id="status"><option value="">전체 상태</option><option value="conditional_call">조건부 연결</option><option value="registered">등록됨</option><option value="generated">이미지 준비됨</option><option value="missing">파일 확인 필요</option></select></label><label>날짜<select id="day"><option value="">1–14일 전체</option></select></label><label>시간대<select id="period"><option value="">전체 시간대</option><option value="0">오전</option><option value="1">오후</option><option value="2">저녁</option></select></label></section>
<p id="summary" role="status" aria-live="polite"></p><div id="content"></div></main>
<dialog id="detail" aria-labelledby="detail-title"><div class="modal-head"><h2 id="detail-title"></h2><button id="close" aria-label="상세 닫기">닫기 ×</button></div><div id="detail-body"></div></dialog>
<footer>저장된 게임 연결을 자동으로 정리합니다. 게임을 수정하거나 선택 보드에 적용하지 않습니다.</footer>
</body></html>
