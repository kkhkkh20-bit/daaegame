<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#211b16">
<title>다람탐정 · 1장 v2 미리보기</title>
<link rel="icon" href="icons/icon-192.png">
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#211b16;overscroll-behavior:none}
#safe{position:fixed;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#surface{position:fixed;overflow:hidden;contain:strict;background:#211b16}
#game{position:absolute;left:0;top:0;border:0;display:block;transform-origin:0 0;background:#211b16}
</style>
<style>/* Shared by the outer iframe shell and the first parsed game loader. */
:root{--inn-walnut:#211b16;--inn-wood:#3b3027;--inn-paper:#f6edd8;--inn-ink:#3d2e21;--inn-brass:#9b8059;--inn-muted:#80694b;--inn-red:#8e473d}
html #bootld,#inn-boot{position:fixed;inset:0;z-index:99999;display:grid;place-items:center;background:var(--inn-walnut)!important;background-image:radial-gradient(ellipse at 50% 35%,#3b302780,transparent 68%)!important;color:var(--inn-paper);text-align:center;font-family:Galmuri11,monospace;box-sizing:border-box}
.boot-shell{display:flex;flex-direction:column;align-items:center;gap:0;padding:24px;box-sizing:border-box;max-width:100%;color:var(--inn-paper)}
.boot-seal{display:grid;place-items:center;width:64px;height:64px;margin-bottom:18px;color:#c4a675}
.boot-seal svg{width:56px;height:56px}
.boot-eyebrow{font:400 10px/1.4 Galmuri11,monospace;letter-spacing:.23em;color:#dcc697}
.boot-shell h1{margin:8px 0 0;font:400 clamp(28px,5vw,40px)/1.35 Galmuri11B,Galmuri11,monospace;letter-spacing:.06em;color:#fff3d6;text-shadow:0 3px 0 #17120f}
.boot-chapter{margin:9px 0 0;font:400 14px/1.4 Galmuri11,monospace;color:#e0cfaa}
.boot-rule{width:64px;height:1px;margin:18px 0 16px;background:var(--inn-brass)}
.boot-lights{display:flex;gap:8px;height:5px}
.boot-lights i{width:5px;height:5px;background:#c4a675;opacity:.35;animation:inn-boot-light 1.5s ease-in-out infinite}
.boot-lights i:nth-child(2){animation-delay:.2s}.boot-lights i:nth-child(3){animation-delay:.4s}
.boot-copy{margin:12px 0 0;font:400 12px/1.6 Galmuri11,monospace;color:#d3c4a1}
@keyframes inn-boot-light{0%,80%,100%{opacity:.3}40%{opacity:1}}
@media(max-height:380px){.boot-shell{padding:16px}.boot-seal{width:44px;height:44px;margin-bottom:10px}.boot-seal svg{width:40px;height:40px}.boot-shell h1{font-size:30px}.boot-rule{margin:12px 0}.boot-chapter{font-size:12px}}
@media(prefers-reduced-motion:reduce){.boot-lights i{animation:none;opacity:.8}}

#inn-boot{position:absolute;transform-origin:0 0}
@font-face{font-family:Galmuri11;src:url(art/ui/galmuri11.woff2) format("woff2");font-display:swap}</style></head>
<body>
<div id="safe" aria-hidden="true"></div>
<div id="surface"><iframe id="game" title="다람탐정 게임" allow="autoplay; fullscreen"></iframe><div id="inn-boot"><section class="boot-shell" role="status" aria-live="polite" aria-label="다람탐정 불러오는 중">
  <span class="boot-seal" aria-hidden="true"><svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter"><path d="M10 15h38v29H10zM10 16l19 15 19-15"/><circle cx="43" cy="43" r="10"/><path d="M50 50l8 8M38 43h10M43 38v10"/></svg></span>
  <small class="boot-eyebrow">DARAM DETECTIVE</small>
  <h1>다람탐정</h1>
  <p class="boot-chapter">1장 · 열세 번째 침대</p>
  <span class="boot-rule" aria-hidden="true"></span>
  <span class="boot-lights" aria-hidden="true"><i></i><i></i><i></i></span>
  <p class="boot-copy">사건 기록을 펼치는 중…</p>
</section>
</div></div>
<script>
(function(){
  var surface=document.getElementById('surface'),frame=document.getElementById('game'),safe=document.getElementById('safe'),pending=0,last='',boot=document.getElementById('inn-boot');
  function handoff(){if(boot){boot.remove();boot=null}}
  window.addEventListener('message',function(e){if(e.source===frame.contentWindow&&e.origin===location.origin&&e.data&&e.data.type==='inn-v2-boot-ready')handoff()});
  frame.addEventListener('load',function(){try{if(frame.contentDocument&&frame.contentDocument.getElementById('app'))handoff()}catch(e){}});
  function fit(){
    pending=0;
    var vv=window.visualViewport,w=vv?Math.min(vv.width,document.documentElement.clientWidth):innerWidth,h=vv?Math.min(vv.height,document.documentElement.clientHeight):innerHeight;
    var ox=vv?vv.offsetLeft:0,oy=vv?vv.offsetTop:0,cs=getComputedStyle(safe);
    var top=parseFloat(cs.paddingTop)||0,right=parseFloat(cs.paddingRight)||0,bottom=parseFloat(cs.paddingBottom)||0,left=parseFloat(cs.paddingLeft)||0;
    var aw=Math.max(1,w-left-right),ah=Math.max(1,h-top-bottom),rotated=ah>aw;
    var long=rotated?ah:aw,short=rotated?aw:ah;
    // Keep the existing game's minimum usable viewport, with one uniform scale.
    var scale=Math.min(1,long/640,short/360),gw=long/scale,gh=short/scale;
    var next=[aw,ah,ox+left,oy+top,gw,gh,scale,rotated].join('|');
    if(next===last)return;last=next;
    surface.style.left=(ox+left)+'px';surface.style.top=(oy+top)+'px';
    surface.style.width=aw+'px';surface.style.height=ah+'px';
    frame.style.width=gw+'px';frame.style.height=gh+'px';
    // A transformed iframe also transforms native hit-testing into its own viewport.
    // clientX/Y, canvas coordinates, fixed overlays and CSS vw/vh stay landscape-local.
    frame.style.transform=rotated?'matrix(0,'+scale+','+(-scale)+',0,'+aw+',0)':'matrix('+scale+',0,0,'+scale+',0,0)';
    if(boot){boot.style.width=frame.style.width;boot.style.height=frame.style.height;boot.style.transform=frame.style.transform}
    surface.dataset.rotated=rotated?'true':'false';
  }
  function schedule(){if(!pending)pending=requestAnimationFrame(fit)}
  fit();(function(){var q='';try{var u=new URLSearchParams(location.search),o=new URLSearchParams();['qa','slot'].forEach(function(k){if(u.has(k))o.set(k,u.get(k))});q=o.toString()}catch(e){}frame.src='play_v2.html?build=c3f9173cd118'+(q?'&'+q:'')})();   /* QA 저장칸(?qa=1·?slot=이름)을 게임 iframe에 그대로 전달 */
  window.addEventListener('resize',schedule);window.addEventListener('orientationchange',schedule);
  window.addEventListener('pageshow',schedule);
  if(window.visualViewport){visualViewport.addEventListener('resize',schedule);visualViewport.addEventListener('scroll',schedule)}
})();
</script>
</body>
</html>
