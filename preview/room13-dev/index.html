  <style>
    html {
      background: #444;
      font-family: sans-serif;
    }

    body, html {
      overscroll-behavior: none;
    }

    #canvas, #overlayDiv {
      position: absolute;
      top: 0px;
      left: 0px;

      width: 100%;
      height: 100%;

      border: 0 none;
    }

    #canvas {
      background: #000;
    }

    .visible {
      visibility: visible;
      opacity: 1.0;
      transition: opacity .1s linear;
    }

    .hidden {
      visibility: hidden;
      opacity: 0;
      transition: visibility 0s .25s, opacity .25s linear;
    }

    #statusDiv, #inputDiv {
      background: rgba(0, 0, 0, 0.75);
      width: 50%;
      margin: auto;
      min-width: 340px;
      padding: 10px;

      position: absolute;
      top: 0;
      left: 0;
      right: 0;

      border-radius: 0 0 5px 5px;
    }

    #statusTextDiv {
      overflow: auto;
      max-height: 40vh;
      color: #ccc;
      font-size: 14px;
    }

    #statusProgress {
      display: none;
      width: 100%;
    }

    #inputDiv {
      width: 65%;
      padding-left: 10px;
      padding-right: 20px;
    }

    #inputPrompt {
      color: #eee;
      font-size: 150%;
      margin-bottom: 1em;
      margin-top: 1em;

    }

    #inputText {
      width: 100%;
      font-size: 175%;
      padding: 5px;
      background: inherit;
      color: #eee;
    }

    #inputText:focus {
      color: #ffffff;
    }

    #ContextContainer {
      position: absolute;
      left: 0px;
      top: 0px;
      color: white;
    }

    #ContextContainer.shown {
      background: rgba(0, 0, 0, 0.5);
      border-radius: 0px 0px 5px 0px;
    }

    #ContextButton {
      text-decoration: none;
      color: lightgrey;
      font-size: xx-large;
      cursor: pointer;
      user-select: none;
      -moz-user-select: none;
      padding: 10px 10px;
      opacity: .75;
    }

    #ContextButton:focus {
      outline: none;
      color: #ffffff;
      opacity: 1.0;
    }

    #ContextMenu a {
      text-decoration: none;
      color: lightgrey;
      background: #444;
      height: 48px;
      width: 250px;
      border-radius: 5px;
      border: 1px solid lightgrey;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 5px 5px;
      opacity: 1.0;
    }

    #ContextMenu a:hover {
      text-decoration: none;
      background: #666666;
      color: #ffffff
    }

    #presplash {
        position: absolute;
        top: 0;
        left: 0;
        display: block;
        margin: auto;
        width: 100%;
        height: 100%;
        object-fit: contain;
    }

  </style>


    <style>
    @font-face{font-family:Galmuri;src:url('Galmuri11.woff2') format('woff2');font-display:swap}
    html,body{margin:0;background:#17120f;font-family:Galmuri,sans-serif;overflow:hidden}
    #presplash{object-fit:cover;filter:brightness(.55);image-rendering:pixelated}
    #loading-brand{position:fixed;left:7vw;top:30vh;color:#f3e7ce;pointer-events:none;z-index:2}
    #loading-brand h1{font-size:clamp(26px,5vw,52px);color:#ffdc91;margin:0 0 16px}
    #loading-brand p{font-size:clamp(14px,2vw,22px);line-height:1.7}
    #statusDiv{top:auto;bottom:5vh;max-width:560px;min-width:0;width:80%;background:#211a16ed;border:1px solid #806446;border-radius:8px;padding:16px;z-index:3}
    #statusTextDiv{color:#f3e7ce;font-family:Galmuri,sans-serif;max-height:25vh}
    #statusProgress{accent-color:#d8b568;height:12px}
    #ContextContainer{left:auto;right:8px;top:4px;z-index:100}
    #ContextButton{font-size:15px;opacity:.4}
    #ContextMenu a{color:#f3e7ce;background:#30261f;border-color:#806446;font-size:14px;width:190px}
    #portrait-note{display:none}
    @media(orientation:portrait){#portrait-note{display:block;position:fixed;bottom:15px;left:5%;width:90%;box-sizing:border-box;padding:12px;text-align:center;color:#f3e7ce;background:#30261fe8;border:1px solid #806446;border-radius:8px;font-size:14px;pointer-events:none;z-index:90}}
    </style>

<style id="r13-title-loader">:root{--title-w:min(100vw,177.7778vh);--title-h:min(56.25vw,100vh);--title-left:calc((100vw - var(--title-w))/2 + var(--title-w)*.05)}
html,body{background:#101b37}
#presplash{object-fit:contain;filter:none;image-rendering:auto}
#loading-brand{left:var(--title-left);top:calc((100vh - var(--title-h))/2 + var(--title-h)*.82);font-family:Galmuri,monospace;color:#edf0ff;text-shadow:0 1px 4px #101b37}
#loading-brand .title-accessible{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
#loading-brand .loading-hint{margin:0;font-size:clamp(12px,calc(var(--title-w)*.015625),20px);color:#edf0ff}
#statusDiv{left:var(--title-left);right:auto;bottom:calc((100vh - var(--title-h))/2 + var(--title-h)*.07);width:calc(var(--title-w)*.43);max-width:550px;min-width:0;padding:8px 0;background:transparent;border:0;border-radius:0}
#statusTextDiv{max-height:10vh;font-size:clamp(11px,calc(var(--title-w)*.01328),17px);color:#d5d8ea}
#statusProgress{accent-color:#b3b5ff;height:4px;border:0}
#ContextMenu a{background:#182442;border-color:#777b9b;color:#eee8dc}
/* The web utility menu must not intercept the in-game settings gear on phones. */
#ContextContainer{pointer-events:none;right:3px;top:3px}
#ContextButton{pointer-events:auto;display:block;width:16px;height:16px;padding:0;font-size:13px;line-height:16px}
#ContextMenu,#ContextMenu a,#ContextMenu input{pointer-events:auto}
</style>
</head>

<body>
  <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex=-1></canvas>
  <div id="overlayDiv"></div>

  <img id="presplash" src="loading-scene.webp">

  <div id="loading-brand"><h1 class="title-accessible">다람탐정</h1><p class="loading-hint">마을의 문을 여는 중…</p></div>
    <div id="portrait-note">휴대폰을 가로로 돌리면 글씨와 조사 지점이 더 잘 보입니다.</div>
    <div id="ContextContainer">
    <a id="ContextButton">&#8801;</a><br />
    <div id="ContextMenu" style="display: none;">
      <input id="ID_SavegamesImport" type="file" onchange="onSavegamesImport(this)" accept="application/zip"
        style=display:none></input>
      <a href="javascript:document.getElementById('ID_SavegamesImport').click();">저장 파일 가져오기</a>
      <a href="javascript:onSavegamesExport();">저장 파일 내보내기</a>
      <a href="javascript:FSDownload('/log.txt', 'text/plain');">실행 기록 다운로드</a>
      <a href="https://www.renpy.org/" target="_blank">
          Powered by Ren'Py
      </a>
      </span>
    </div>
  </div>

  <div id="statusDiv" class="hidden">
    <div id="statusTextDiv"></div>
    <progress id="statusProgress" value="0" max="100"></progress>
  </div>

  <div id="inputDiv" class="hidden">
    <form id="inputForm">
      <div id="inputPrompt"></div>
      <input id="inputText" type="text">
    </form>
  </div>

  <script>
      // The URL to game.zip, relative to the URL of this file.
      window.gameZipURL = 'game.zip';

      // Register the service worker.
      if (navigator.serviceWorker) {
          if (!navigator.serviceWorker.controller) {
              navigator.serviceWorker.register('./service-worker.js', { updateViaCache: 'all' });
          }
      }
  </script>
  <script src="renpy-pre.js?v=9ada8239e3cb"></script>
  <script async type="text/javascript" src="renpy.js"></script>
<script>
    const brand=document.getElementById('loading-brand');
    const observer=new MutationObserver(()=>{if(!document.getElementById('presplash')){brand.remove();observer.disconnect();}});
    observer.observe(document.body,{childList:true});
    </script></body>

</html>
