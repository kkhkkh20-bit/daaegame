  <style>
    html {
      background: #444;
      font-family: sans-serif;
    }

    body, html {
      overscroll-behavior: none;
    }

    #canvas, #overlayDiv {
      position: absolute;
      top: 0px;
      left: 0px;

      width: 100%;
      height: 100%;

      border: 0 none;
    }

    #canvas {
      background: #000;
      /* 2026-10-27 휴대폰 세로 캡처(현장이 좌우로 잘림): 빠른 두 번 탭·손가락 벌리기로 페이지가 확대되면 캔버스가
         화면보다 커져 좌우가 잘린다. 캔버스 위 터치는 게임에만 준다. */
      touch-action: none;
    }

    .visible {
      visibility: visible;
      opacity: 1.0;
      transition: opacity .1s linear;
    }

    .hidden {
      visibility: hidden;
      opacity: 0;
      transition: visibility 0s .25s, opacity .25s linear;
    }

    #statusDiv, #inputDiv {
      background: rgba(0, 0, 0, 0.75);
      width: 50%;
      margin: auto;
      min-width: 340px;
      padding: 10px;

      position: absolute;
      top: 0;
      left: 0;
      right: 0;

      border-radius: 0 0 5px 5px;
    }

    #statusTextDiv {
      overflow: auto;
      max-height: 40vh;
      color: #ccc;
      font-size: 14px;
    }

    #statusProgress {
      display: none;
      width: 100%;
    }

    #inputDiv {
      width: 65%;
      padding-left: 10px;
      padding-right: 20px;
    }

    #inputPrompt {
      color: #eee;
      font-size: 150%;
      margin-bottom: 1em;
      margin-top: 1em;

    }

    #inputText {
      width: 100%;
      font-size: 175%;
      padding: 5px;
      background: inherit;
      color: #eee;
    }

    #inputText:focus {
      color: #ffffff;
    }

    #ContextContainer {
      position: absolute;
      left: 0px;
      top: 0px;
      color: white;
    }

    #ContextContainer.shown {
      background: rgba(0, 0, 0, 0.5);
      border-radius: 0px 0px 5px 0px;
    }

    #ContextButton {
      text-decoration: none;
      color: lightgrey;
      font-size: xx-large;
      cursor: pointer;
      user-select: none;
      -moz-user-select: none;
      padding: 10px 10px;
      opacity: .75;
    }

    #ContextButton:focus {
      outline: none;
      color: #ffffff;
      opacity: 1.0;
    }

    #ContextMenu a {
      text-decoration: none;
      color: lightgrey;
      background: #444;
      height: 48px;
      width: 250px;
      border-radius: 5px;
      border: 1px solid lightgrey;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 5px 5px;
      opacity: 1.0;
    }

    #ContextMenu a:hover {
      text-decoration: none;
      background: #666666;
      color: #ffffff
    }

    #presplash {
        position: absolute;
        top: 0;
        left: 0;
        display: block;
        margin: auto;
        width: 100%;
        height: 100%;
        object-fit: contain;
    }

  </style>


    <style>

<style id="r13-title-loader">:root{--title-w:min(100vw,177.7778vh);--title-h:min(56.25vw,100vh);--title-left:calc((100vw - var(--title-w))/2 + var(--title-w)*.05)}
/* 로딩 그림(1280x720)은 엽서 뒤 남색 천이 가장자리라 letterbox 도 같은 남색으로 잇는다. */
html,body{background:#0a2252}
#presplash{object-fit:contain;filter:none;image-rendering:auto}
/* 소유자 결정(2026-10-24) 고딕체. 글꼴 파일을 더 받지 않도록 시스템 고딕으로 떨어진다. */
/* 안내 줄은 진행 막대(statusDiv) 바로 위에 아래쪽 기준으로 쌓는다. 위쪽 기준이면 음악 안내 줄이 붙을 때 막대와 겹친다. */
#loading-brand{left:var(--title-left);top:auto;bottom:calc((100vh - var(--title-h))/2 + var(--title-h)*.07 + 2.8em);font-family:Pretendard,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;font-weight:700;color:#edf0ff;text-shadow:0 1px 4px #061535}
#loading-brand .title-accessible{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
#loading-brand .loading-hint{margin:0;font-size:clamp(12px,calc(var(--title-w)*.015625),20px);color:#edf0ff}
/* 자동재생이 막힌 동안만 보이는 줄. [hidden] 이 풀리면 안내 줄 바로 아래에 붙는다. */
#loading-brand .loading-audio-hint{margin:.35em 0 0;font-size:clamp(11px,calc(var(--title-w)*.0125),16px);font-weight:400;color:#c9d0f2}
#loading-brand .loading-audio-hint[hidden]{display:none}
#statusDiv{left:var(--title-left);right:auto;bottom:calc((100vh - var(--title-h))/2 + var(--title-h)*.07);width:calc(var(--title-w)*.43);max-width:550px;min-width:0;padding:8px 0;background:transparent;border:0;border-radius:0}
#statusTextDiv{max-height:10vh;font-size:clamp(11px,calc(var(--title-w)*.01328),17px);color:#d5d8ea}
#statusProgress{accent-color:#b3b5ff;height:4px;border:0}
#ContextMenu a{background:#182442;border-color:#777b9b;color:#eee8dc}
/* The web utility menu must not intercept the in-game settings gear on phones. */
#ContextContainer{pointer-events:none;right:3px;top:3px}
#ContextButton{pointer-events:auto;display:block;width:16px;height:16px;padding:0;font-size:13px;line-height:16px}
#ContextMenu,#ContextMenu a,#ContextMenu input{pointer-events:auto}
/* 세로 휴대폰: 그림(16:9)이 가운데 띠로만 보이고 위아래가 남색 여백이다. 글을 그림 위에 얹지 않고 아래 여백에 둔다. */
@media (max-aspect-ratio:1/1){
#loading-brand{left:5vw;bottom:auto;top:calc(50vh + var(--title-h)/2 + 14px)}
#statusDiv{left:5vw;bottom:auto;top:calc(50vh + var(--title-h)/2 + 14px + 3.2em);width:90vw;max-width:none}
}
</style>

<script id="r13-loading-audio">// HTML owns the music until the first Ren'Py interaction hands it over.
(function () {
    const audio = new Audio('game/assets/bgm-title.mp3?v=1f0e9975bd24');
    audio.id = 'r13-loading-music';
    audio.loop = true;
    audio.volume = .75;
    audio.preload = 'auto';
    document.body.appendChild(audio);
    let finished = false;
    // 소유자(2026-10-27): "배경음은 로딩 나올때부터 나와야한다고". 브라우저는 사용자가 한 번 누르기 전에는
    // 소리를 거부하므로 코드로 더 당길 수 없다. 대신 거부된 동안만 "누르면 켜진다"는 줄을 편다.
    function audioHint() {
        return (typeof document.querySelector === 'function') ? document.querySelector('#loading-brand .loading-audio-hint') : null;
    }
    function showHint(show) {
        const hint = audioHint();
        if (hint) hint.hidden = !show;
    }
    function start() {
        if (finished || !audio.paused) return;
        // Call synchronously inside the gesture, including on iOS Safari.
        audio.play().then(() => { if (finished) audio.pause(); else showHint(false); })
            .catch(() => { if (!finished) showHint(true); });
    }
    function stop() {
        if (finished) return 0;
        finished = true;
        showHint(false);
        const position = audio.currentTime || 0;
        audio.pause();
        audio.removeAttribute('src');
        audio.load();
        for (const event of ['pointerdown', 'touchstart', 'keydown']) {
            document.removeEventListener(event, start, true);
        }
        return position;
    }
    function handoff() {
        const context = window.renpyAudio && window.renpyAudio.context;
        if (!context || context.state === 'running' || audio.paused) return stop();
        // Safari may create the engine context after the loading-screen gesture.
        // Keep HTML audible until that context can actually take ownership.
        const position = audio.currentTime || 0;
        const ready = () => {
            if (context.state !== 'running') return;
            stop();
            context.removeEventListener('statechange', ready);
        };
        context.addEventListener('statechange', ready);
        context.resume().then(ready).catch(() => {});
        return position;
    }
    window.r13LoadingAudio = {audio, handoff};
    for (const event of ['pointerdown', 'touchstart', 'keydown']) {
        document.addEventListener(event, start, {capture: true, passive: true});
    }
    window.addEventListener('pagehide', stop, {once: true});
    start(); // Allowed on returning/engaged sites; rejection stays silent.
})();
</script>
