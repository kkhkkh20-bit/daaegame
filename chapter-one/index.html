<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#251c17"><title>다람 탐정 — 사라진 봉투</title><link rel="stylesheet" href="style.css"></head><body>
<main id="game" aria-label="다람 탐정 1장"><div id="scene"><div id="background"></div><div id="hotspots"></div><div id="actor" aria-hidden="true"></div><div class="shade"></div></div>
<header><div class="place"><span class="pin">♧</span><div><b id="place">임시 거처 접수대</b><small id="subtitle">눈이 머무는 동안, 모두의 쉼터</small></div></div><nav><button id="log" aria-label="대화 기록">기록</button><button id="notebook">수첩<span id="count"></span></button><button id="settings" aria-label="설정">⚙</button></nav></header>
<div id="chaptermark" hidden></div><div id="objective" hidden></div><section id="panel" aria-label="대화"></section><div id="modal"></div><div id="toast" role="status" hidden></div>
<div id="title"><div class="title-copy"><small>다람 탐정 · 첫 번째 사건</small><h1>사라진<br>봉투</h1><p>서명은 진짜였다.<br>그것이 진실의 전부는 아니었다.</p><button id="start" disabled>사건 시작 <span>↗</span></button><button id="continue" hidden disabled>이어 하기</button><p id="load-status" role="status">접수대 장면을 불러오는 중…</p><button id="retry-load" hidden>다시 불러오기</button><noscript><p>이 게임은 자바스크립트가 켜진 Safari 또는 Chrome에서 열어 주세요.</p></noscript><small class="playtime">대화 · 현장 조사 · 증언 검증</small></div><p class="title-foot">눈길 거처에서 시작되는 작은 의심</p></div>
</main><script src="boot.js"></script><script src="story.js" onerror="chapterLoadError()"></script><script src="game.js" onerror="chapterLoadError()"></script></body></html>
