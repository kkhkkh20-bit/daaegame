<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>다람탐정 에셋 도구함</title>
<style>
:root{font-family:system-ui,sans-serif;color:#352820;background:#f5f1e8;font-weight:600}*{box-sizing:border-box}body{margin:0}header{padding:22px 28px;background:#253a50;color:#fff6e6;display:flex;gap:20px;align-items:center}h1{font-size:23px;margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid #ac9480;border-radius:8px;background:#fffaf0;padding:10px 14px;color:#352820}button:disabled{opacity:.45;cursor:default}button.primary{background:#bd3438;color:white;border-color:#912529}button:hover:not(:disabled){box-shadow:0 0 0 2px #c9a87e}header button{margin-left:auto}main{max-width:1600px;margin:auto;padding:22px;display:grid;grid-template-columns:260px minmax(340px,1fr) 310px;gap:20px}aside,section.panel{background:#fffdf6;border:1px solid #d7c9b5;border-radius:12px;padding:18px;align-self:start}h2{font-size:18px;margin:0 0 14px}h3{font-size:15px;margin:12px 0}p{font-size:14px;line-height:1.55}label{display:block;font-size:14px;margin-bottom:7px}input,select,textarea{border:1px solid #baa790;border-radius:7px;background:white;color:#352820;padding:10px;width:100%}textarea{resize:vertical;min-height:120px}small,.muted{color:#70665b;font-size:12px;line-height:1.5}.roles{display:grid;gap:8px;margin-top:12px}.role{text-align:left;font-size:13px;overflow-wrap:anywhere}.role[aria-pressed=true]{background:#f6e0be;border:2px solid #8e5734}.role small{display:block}.toolbar{display:grid;grid-template-columns:1fr 180px;gap:10px;margin:14px 0}.states{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.state{border:1px solid #ded3c1;border-radius:8px;padding:9px;overflow:hidden}.state p{margin:4px 0;overflow-wrap:anywhere}.preview{width:100%;height:110px;background:repeating-conic-gradient(#f1eee6 0% 25%,#e5e1d8 0% 50%) 0/16px 16px;object-fit:contain;border-radius:5px}.asset-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}.asset{text-align:left;padding:10px;min-width:0}.asset[aria-pressed=true]{outline:3px solid #bc3739}.asset strong{display:block;font-size:13px;margin-top:6px;overflow-wrap:anywhere}.asset small{display:block;overflow-wrap:anywhere}.tags{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0}.tag{padding:3px 7px;border-radius:4px;background:#eee5d5;font-size:11px;overflow-wrap:anywhere}#errors{max-width:1556px;margin:18px auto 0;background:#fff0e9;border:1px solid #d6a286;padding:14px;border-radius:8px;font-size:13px}#errors:empty{display:none}#errors ul{padding-left:22px;max-height:180px;overflow:auto}#status{font-weight:500;font-size:13px}#detail{position:sticky;top:20px}#detail .preview{height:150px}.actions{display:grid;gap:10px;margin-top:16px}.note{padding:10px;background:#f4ead7;border-radius:6px}.path{overflow-wrap:anywhere}#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#253a50;color:white;padding:14px 24px;border-radius:10px;z-index:2;max-width:80%;font-size:14px}#toast:empty{display:none}@media(max-width:1050px){main{grid-template-columns:220px 1fr}#detail{grid-column:1/-1;position:static}.states{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){header{padding:16px;flex-wrap:wrap}main{padding:12px;display:block}aside,section.panel{margin-bottom:14px}.toolbar{grid-template-columns:1fr}.roles{max-height:200px;overflow:auto}}
</style>
<header><h1>다람탐정 에셋 도구함</h1><span id="status" role="status">불러오는 중</span><button id="reload">새로고침</button></header>
<div id="errors" role="alert"></div>
<main><aside><h2>화면 역할</h2><p class="muted">역할을 고른 뒤 연결할 에셋을 선택하세요. 필수 상태가 맞아야 저장됩니다.</p><input id="role-search" type="search" aria-label="역할 검색" placeholder="역할 이름, 파일명 검색"><div id="roles" class="roles"></div><div id="role-pages" class="actions"></div></aside>
<section class="panel"><h2 id="role-title">역할을 선택하세요</h2><p id="role-info" class="muted"></p><div id="states" class="states"></div><div class="toolbar"><input id="search" type="search" aria-label="에셋 검색" placeholder="이름, 경로, 태그 검색"><select id="tag-filter" aria-label="태그 필터"><option value="">모든 태그</option></select></div><p id="count" class="muted"></p><div id="assets" class="asset-grid"></div><div id="asset-pages" class="actions"></div></section>
<aside id="detail"><h2>에셋 상세</h2><div id="detail-empty" class="muted">카드를 선택하면 연결과 태그를 편집할 수 있습니다.</div><div id="detail-content" hidden><div id="detail-media"></div><h3 id="asset-title"></h3><p id="asset-path" class="path muted"></p><p id="asset-spec" class="muted"></p><div class="actions"><button id="assign" class="primary">선택한 역할에 연결</button><p id="assign-info" class="muted"></p></div><hr style="border:0;border-top:1px solid #ded3c1;margin:22px 0"><label for="tag-editor">태그 · 쉼표 또는 줄바꿈으로 구분</label><textarea id="tag-editor"></textarea><p class="muted">pack / family / kit / state 태그는 상태 연결에 사용됩니다. 연결이 깨지는 변경은 저장되지 않습니다.</p><button id="save-tags">태그 저장</button><p class="note muted">원본 이미지는 수정하지 않습니다. 미리보기는 원본 비율과 등록된 crop을 적용합니다. Frame 설정은 아래 수치로 확인하세요.</p></div></aside></main><div id="toast" role="status"></div>
<script>
'use strict';
let data=null,role=null,picked=null,busy=false,toastTimer,assetPage=0,rolePage=0;const pageSize=80;
const $=id=>document.getElementById(id),names={basic:'기본',pressed:'누름',selected:'선택',disabled:'비활성'};
function el(tag,text,cls){const node=document.createElement(tag);if(text!==undefined)node.textContent=text;if(cls)node.className=cls;return node;}
function toast(message){$('toast').textContent=message;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').textContent='',6500);}
function showErrors(errors){$('errors').replaceChildren();if(!errors?.length)return;$('errors').append(el('strong','검증이 필요한 항목'));const list=el('ul');for(const e of errors)list.append(el('li',`${e.scope}: ${e.message}`));$('errors').append(list);}
function imageURL(path){return '/'+path.split('/').map(encodeURIComponent).join('/');}
function preview(canvas,asset){const ctx=canvas.getContext('2d');ctx.clearRect(0,0,canvas.width,canvas.height);if(!asset?.path)return;const ticket=Symbol();canvas.ticket=ticket;const image=new Image();image.onload=()=>{if(canvas.ticket!==ticket)return;let [x,y,w,h]=asset.render?.crop||[0,0,image.naturalWidth,image.naturalHeight];if(w<=0||h<=0)return;const ratio=Math.min(canvas.width/w,canvas.height/h,window.devicePixelRatio||1);ctx.drawImage(image,x,y,w,h,(canvas.width-w*ratio)/2,(canvas.height-h*ratio)/2,w*ratio,h*ratio);};image.onerror=()=>{if(canvas.ticket===ticket){ctx.fillStyle='#9c3030';ctx.font='16px sans-serif';ctx.fillText('이미지를 열 수 없습니다.',12,35);}};image.src=imageURL(asset.path);}
function media(a){return a?.media||(/\.(ogg|mp3|wav|opus|flac)$/i.test(a?.path)?'audio':/\.(ttf|otf|woff2?)$/i.test(a?.path)?'font':'image');}
function mediaNode(a,detailed=false){const kind=media(a);if(kind==='image'){const canvas=el('canvas',undefined,'preview');canvas.width=440;canvas.height=180;preview(canvas,a);return canvas;}if(kind==='audio'){if(detailed){const audio=el('audio');audio.controls=true;audio.preload='none';audio.src=imageURL(a.path);audio.style.width='100%';return audio;}return el('p','소리 에셋 · 상세에서 재생','note');}const sample=el('p','다람탐정 가나다 123','note');sample.style.fontSize='22px';if(detailed&&window.FontFace){const font=new FontFace('asset-preview-'+Math.random().toString(36).slice(2),`url(${JSON.stringify(imageURL(a.path))})`);font.load().then(face=>{document.fonts.add(face);sample.style.fontFamily=JSON.stringify(face.family);}).catch(()=>sample.textContent='글꼴을 열 수 없습니다.');}return sample;}
function pages(id,total,page,change){const box=$(id);box.replaceChildren();if(total<=pageSize)return;const prev=el('button','이전'),next=el('button','다음');prev.disabled=page===0;next.disabled=(page+1)*pageSize>=total;prev.onclick=()=>change(page-1);next.onclick=()=>change(page+1);box.append(el('small',`${page+1} / ${Math.ceil(total/pageSize)} 페이지 · ${total}개`),prev,next);}
function roleOrder([id,a],[other,b]){const rank=(k,v)=>/^(file[:./]|asset[:./])/.test(k)||v.generated?1:0;return rank(id,a)-rank(other,b)||id.localeCompare(other);}
function renderRoles(){const root=$('roles');root.replaceChildren();const query=$('role-search').value.toLocaleLowerCase(),entries=Object.entries(data.bindings.bindings).sort(roleOrder).filter(([id,b])=>[id,b.label||'',b.media||''].join(' ').toLocaleLowerCase().includes(query));rolePage=Math.min(rolePage,Math.max(0,Math.ceil(entries.length/pageSize)-1));for(const [id,binding] of entries.slice(rolePage*pageSize,(rolePage+1)*pageSize)){const button=el('button',binding.label||id,'role');button.append(el('small',id));button.setAttribute('aria-pressed',id===role);button.onclick=()=>{role=id;renderRoles();renderStates();renderDetail();};root.append(button);}pages('role-pages',entries.length,rolePage,p=>{rolePage=p;renderRoles();});}
function renderStates(){const binding=data.bindings.bindings[role];$('role-title').textContent=binding?.label||role||'등록된 역할이 없습니다';$('role-info').textContent=binding?`${(binding.match||[]).join(' · ')} / ${binding.refresh==='restart'?'게임을 다시 시작하면 반영':'게임 화면을 다시 열면 반영'}${binding.group?' / 묶음 연결: '+binding.group:''}`:'';$('states').replaceChildren();for(const state of Object.keys(names)){const box=el('div',undefined,'state');box.append(el('strong',names[state]));const asset=data.resolved[role]?.[state];if(asset&&!asset.error){box.append(mediaNode(asset),el('p',asset.label||asset.id||asset.path,'muted'));}else{box.append(el('p',asset?.error||'이 역할에 등록되지 않은 상태입니다.','muted'));}$('states').append(box);}}
function renderAssets(){const query=$('search').value.toLocaleLowerCase(),tag=$('tag-filter').value;const assets=Object.entries(data.catalog.assets).filter(([id,a])=>(!tag||(a.tags||[]).includes(tag))&&[id,a.label||'',a.path,...(a.tags||[])].join(' ').toLocaleLowerCase().includes(query));assetPage=Math.min(assetPage,Math.max(0,Math.ceil(assets.length/pageSize)-1));$('count').textContent=`${assets.length}개 에셋 · 한 페이지에 최대 ${pageSize}개`;$('assets').replaceChildren();for(const [id,a] of assets.slice(assetPage*pageSize,(assetPage+1)*pageSize)){const button=el('button',undefined,'asset');button.setAttribute('aria-pressed',id===picked);button.append(mediaNode(a),el('strong',a.label||a.path.split('/').pop()),el('small',a.size?.join(' × ')||media(a)));const tags=el('div',undefined,'tags');for(const t of (a.tags||[]).filter(t=>!t.startsWith('asset:')).slice(0,4))tags.append(el('span',t,'tag'));button.append(tags);button.onclick=()=>{picked=id;renderAssets();renderDetail();};$('assets').append(button);}pages('asset-pages',assets.length,assetPage,p=>{assetPage=p;renderAssets();});}
function assignIssue(asset){const binding=data.bindings.bindings[role];if(!binding)return '먼저 역할을 선택하세요.';if(binding.media&&media(asset)!==binding.media)return '이 역할과 같은 종류의 에셋을 선택하세요. 필요: '+({image:'이미지',audio:'소리',font:'글꼴'}[binding.media]||binding.media);if(binding.canvas_size&&JSON.stringify(asset.size)!==JSON.stringify(binding.canvas_size))return '캔버스 크기가 같아야 합니다. 필요: '+binding.canvas_size.join(' × ');return '';}
function renderDetail(){const a=data.catalog.assets[picked];$('detail-empty').hidden=!!a;$('detail-content').hidden=!a;if(!a)return;$('asset-title').textContent=a.label||a.path.split('/').pop();$('asset-path').textContent=a.path;$('asset-spec').textContent=`${picked} · ${a.size?.join(' × ')||media(a)} · render ${JSON.stringify(a.render||{})}`;$('tag-editor').value=(a.tags||[]).join(', ');$('assign').textContent=role?`‘${data.bindings.bindings[role]?.label||role}’에 연결`:'먼저 역할을 선택하세요';const issue=assignIssue(a);$('assign').disabled=!!issue||busy;$('assign-info').textContent=issue||(data.bindings.bindings[role]?.group?'같은 묶음의 역할이 함께 변경됩니다.':'필수 상태를 검증한 뒤 연결을 저장합니다.');$('save-tags').disabled=busy;$('detail-media').replaceChildren(mediaNode(a,true));}
function render(){showErrors(data.errors);const roles=Object.entries(data.bindings.bindings).sort(roleOrder).map(([id])=>id);if(!roles.includes(role))role=roles[0]||null;if(!data.catalog.assets[picked])picked=null;const old=$('tag-filter').value;$('tag-filter').replaceChildren(new Option('모든 태그',''));for(const tag of [...new Set(Object.values(data.catalog.assets).flatMap(a=>a.tags||[]))].filter(tag=>!tag.startsWith('asset:')).sort())$('tag-filter').add(new Option(tag,tag));$('tag-filter').value=old;renderRoles();renderStates();renderAssets();renderDetail();$('status').textContent=data.errors.length?`검증 오류 ${data.errors.length}개`:'로컬 카탈로그 연결됨';}
async function load(){try{const response=await fetch('/api/catalog');if(!response.ok)throw Error('카탈로그를 읽지 못했습니다.');data=await response.json();render();}catch(e){$('status').textContent='연결 실패';toast(e.message);}}
async function save(path,body){if(busy)return;const draft=$('tag-editor').value;let saved=false;busy=true;renderDetail();try{const response=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json','X-Asset-Token':data.token},body:JSON.stringify(body)});const result=await response.json();if(!response.ok){showErrors(result.errors||[]);throw Error(result.error||'저장 실패');}data=result;saved=true;render();toast('저장했습니다. '+(data.bindings.bindings[role]?.refresh==='restart'?'게임을 다시 시작하면 반영됩니다.':'게임 화면을 다시 열면 반영됩니다.'));}catch(e){toast(e.message);}finally{busy=false;renderDetail();if(!saved&&path==='/api/tags')$('tag-editor').value=draft;}}
$('reload').onclick=load;$('role-search').oninput=()=>{rolePage=0;if(data)renderRoles();};$('search').oninput=()=>{assetPage=0;if(data)renderAssets();};$('tag-filter').onchange=()=>{assetPage=0;if(data)renderAssets();};$('assign').onclick=()=>save('/api/assign',{role,asset_id:picked});$('save-tags').onclick=()=>save('/api/tags',{asset_id:picked,tags:$('tag-editor').value.split(/[,\n]/).map(t=>t.trim()).filter(Boolean)});load();
</script></html>
