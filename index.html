<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>다애 탐정 사무소</title>
<meta name="description" content="다애와 함께 푸는 동물 마을 추리 게임">
<meta name="theme-color" content="#0E1128">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="다애 탐정">
<style>
  :root{--bg:#0E1128;--glow:#2B3170}
  html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;color-scheme:dark}
  body{background:radial-gradient(ellipse at 50% 30%,var(--glow) 0%,var(--bg) 70%) fixed}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  #frame{display:block;border:0;background:#141833;width:100vw;height:100vh;height:100dvh}
  /* Wide screens (PC, tablet landscape): lock the game to a portrait phone-shaped column */
  @media (min-width:600px) and (min-aspect-ratio:3/4){
    #frame{height:calc(100vh - 32px);height:calc(100dvh - 32px);max-height:980px;width:auto;aspect-ratio:9/18;
      border-radius:26px;box-shadow:0 0 0 2px #2A3060,0 24px 80px rgba(0,0,0,.55),0 0 120px rgba(242,194,48,.08)}
  }
  @media (min-width:600px) and (min-aspect-ratio:3/4) and (max-height:520px){
    #frame{height:100vh;height:100dvh;border-radius:0}
  }
</style>
</head>
<body>
<div id="kakao" hidden style="position:fixed;inset:0;z-index:5;display:grid;place-items:center;padding:24px;background:#0E1128;color:#F4F1E6;font:16px/1.6 sans-serif;text-align:center">
  <div style="max-width:340px">
    <p style="font-size:20px;color:#F2C230;margin:0 0 10px">카카오톡 안에서는 기록이 지워져요</p>
    <p style="margin:0 0 16px">카카오톡 안의 화면은 닫으면 저장이 사라질 수 있어요. 크롬이나 사파리로 열어서 이어 하세요.</p>
    <a id="kakaoOut" href="#" style="display:inline-block;background:#F2C230;color:#1B2447;border-radius:12px;padding:12px 20px;text-decoration:none;font-size:17px">브라우저로 열기</a>
    <p style="margin:16px 0 0;font-size:14px;opacity:.8">안 열리면 오른쪽 위(또는 아래) 메뉴에서<br>"다른 브라우저로 열기"를 눌러 주세요.</p>
    <p id="kakaoUrl" style="margin:12px 0 0;font-size:13px;opacity:.7;word-break:break-all;user-select:all"></p>
  </div>
</div>
<div id="stage"><iframe id="frame" src="game.html" title="다애 탐정 사무소" allow="autoplay; fullscreen"></iframe></div>
<script>
// KakaoTalk's in-app browser wipes storage: send the player to the real browser
(function(){
  if(!/KAKAOTALK/i.test(navigator.userAgent))return;
  var url=location.href,out="kakaotalk://web/openExternal?url="+encodeURIComponent(url);
  var k=document.getElementById("kakao");k.hidden=false;
  document.getElementById("kakaoOut").href=out;
  document.getElementById("kakaoUrl").textContent=url;
  try{location.href=out}catch(e){}
})();
(function(){
  var f=document.getElementById("frame");
  f.addEventListener("load",function(){try{f.contentWindow.focus()}catch(e){}});
  document.addEventListener("keydown",function(){try{f.contentWindow.focus()}catch(e){}});
  // Installed app on a desktop: open the window once in a portrait size (the user can resize afterwards)
  try{
    var standalone=matchMedia("(display-mode: standalone)").matches||matchMedia("(display-mode: window-controls-overlay)").matches;
    var desktop=matchMedia("(pointer: fine)").matches;
    if(standalone&&desktop&&!localStorage.getItem("daae:sized")){
      var h=Math.min(screen.availHeight-40,1000),w=Math.round((h-32)*9/18)+48;
      window.resizeTo(w,h);window.moveTo(Math.round((screen.availWidth-w)/2),Math.round((screen.availHeight-h)/2));
      localStorage.setItem("daae:sized","1");
    }
  }catch(e){}
  if("serviceWorker" in navigator){
    window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})});
  }
})();
</script>
</body>
</html>
