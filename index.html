<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>다람탐정</title>
<meta http-equiv="refresh" content="0; url=preview/room13-dev/">
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         background: #211a16; color: #f3e7ce; font-family: sans-serif; }
  a { color: #ffdc91; }
</style>
</head>
<body>
<p>다람탐정으로 이동합니다. 넘어가지 않으면 <a href="preview/room13-dev/">여기</a>를 누르세요.</p>
<script>
  // Release the old 1장 테스트판 service worker if this browser still has it.
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.getRegistrations().then((rs) => rs.forEach((r) => {
      if (r.active && r.active.scriptURL.endsWith("/daaegame/sw.js")) r.update();
    }));
  }
  location.replace("preview/room13-dev/");
</script>
</body>
</html>
