<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>다람탐정 지도 에셋 배치·드래그 참고</title><style>
*{box-sizing:border-box}body{margin:0;background:#29231f;color:#4b3524;font-family:'Noto Sans CJK KR','Malgun Gothic',sans-serif}#stage{position:relative;width:1280px;height:720px;transform-origin:top left;overflow:hidden;background:#ded9c8}#viewport{position:absolute;left:88px;top:58px;width:1136px;height:570px;overflow:hidden;touch-action:none;cursor:grab;background:#e9e5d7}#viewport.dragging{cursor:grabbing}#content{position:absolute;left:0;top:0;transform-origin:top left}#map{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;user-select:none}.label{position:absolute;width:144px;height:38px;border:0;background:transparent url('assets/label_plate.svg') center/100% 100%;font:700 22px 'Noto Sans CJK KR','Malgun Gothic',sans-serif;color:#513921;text-align:center;white-space:nowrap;transform:translate(-50%,-50%);cursor:pointer}.label.selected{outline:3px solid #a84935;outline-offset:2px;border-radius:12px}.hit{position:absolute;background:none;border:0;cursor:pointer}.frame{position:absolute;inset:0;width:1280px;height:720px;pointer-events:none}.title{position:absolute;left:430px;top:20px;width:420px;text-align:center;font-size:22px;font-weight:700}.footer{position:absolute;left:110px;top:644px;width:1060px;height:40px;display:flex;align-items:center;gap:15px}.footer button{font:700 18px inherit;color:#503523;background:#fff1d1;border:2px solid #b89051;border-radius:9px;padding:7px 16px;cursor:pointer}.note{margin-left:auto;font-size:16px}.selected-name{font-weight:700;font-size:20px}button:focus-visible{outline:3px solid #216e89}#error{position:absolute;left:120px;top:95px;color:#8f241f;max-width:900px;background:#fff;padding:12px;display:none}
</style><div id="stage"><div id="viewport" tabindex="0" aria-label="지도 배치 참고. 드래그 또는 방향키로 이동"><div id="content"><img id="map" src="assets/village_clean.png" alt="기존 배치를 따른 마을 전체 지도"></div></div><img class="frame" src="assets/notebook_frame_1280x720.png" alt=""><div class="title">다람탐정 · 지도 배치 참고</div><div class="footer"><span class="selected-name" id="selected">선택: 없음</span><button id="reset">전체 보기</button><button id="zoom">확대 보기</button><span class="note">드래그·방향키: 둘러보기 / 이름 선택만 · 게임 이동 없음</span></div><div id="error"></div></div><script src="layout.js"></script><script>
'use strict';
const L=window.MAP_LAYOUT,stage=document.querySelector('#stage'),vp=document.querySelector('#viewport'),content=document.querySelector('#content');
let zoom=1,tx=0,ty=0,gesture=null,selected=null;
const VW=1136,VH=570,threshold=8;
function fitStage(){const s=Math.min(innerWidth/1280,innerHeight/720);stage.style.transform=`scale(${s})`;return s;}
addEventListener('resize',fitStage);fitStage();
content.style.width=L.canvas.width+'px';content.style.height=L.canvas.height+'px';
function limit(){tx=L.canvas.width*zoom<VW?(VW-L.canvas.width*zoom)/2:Math.max(VW-L.canvas.width*zoom,Math.min(0,tx));ty=L.canvas.height*zoom<VH?(VH-L.canvas.height*zoom)/2:Math.max(VH-L.canvas.height*zoom,Math.min(0,ty));}
function paint(){limit();content.style.transform=`translate(${tx}px,${ty}px) scale(${zoom})`;}
function setZoom(z){const cx=(VW/2-tx)/zoom,cy=(VH/2-ty)/zoom;zoom=z;tx=VW/2-cx*z;ty=VH/2-cy*z;paint();}
function select(id){selected=id;for(const el of content.querySelectorAll('.label'))el.classList.toggle('selected',el.dataset.id===id);document.querySelector('#selected').textContent='선택: '+L.locations.find(x=>x.id===id).label;}
for(const r of L.locations){const hit=document.createElement('button');hit.className='hit';hit.dataset.id=r.id;hit.tabIndex=-1;hit.setAttribute('aria-label',r.label+' 선택 참고');const[x,y,w,h]=r.provisional_hit_rect;Object.assign(hit.style,{left:x+'px',top:y+'px',width:w+'px',height:h+'px'});content.append(hit);}
for(const r of L.locations){const b=document.createElement('button');b.className='label';b.textContent=r.label;b.dataset.id=r.id;b.style.left=r.label_center[0]+'px';b.style.top=r.label_center[1]+'px';b.setAttribute('aria-label',r.label+' 선택 참고');b.addEventListener('click',e=>{if(e.detail===0)select(r.id)});content.append(b);}
vp.addEventListener('pointerdown',e=>{if(e.button!==0)return;gesture={id:e.pointerId,x:e.clientX,y:e.clientY,tx,ty,drag:false,target:e.target.closest('[data-id]')?.dataset.id};vp.setPointerCapture(e.pointerId);});
vp.addEventListener('pointermove',e=>{if(!gesture||e.pointerId!==gesture.id)return;const dx=e.clientX-gesture.x,dy=e.clientY-gesture.y;if(Math.hypot(dx,dy)>threshold)gesture.drag=true;if(gesture.drag){const s=fitStage();tx=gesture.tx+dx/s;ty=gesture.ty+dy/s;vp.classList.add('dragging');paint();}});
function end(e,cancel){if(!gesture||e.pointerId!==gesture.id)return;const g=gesture;gesture=null;vp.classList.remove('dragging');if(vp.hasPointerCapture(e.pointerId))vp.releasePointerCapture(e.pointerId);if(!cancel&&!g.drag&&g.target)select(g.target);}
vp.addEventListener('pointerup',e=>end(e,false));vp.addEventListener('pointercancel',e=>end(e,true));vp.addEventListener('lostpointercapture',()=>{gesture=null;vp.classList.remove('dragging')});
vp.addEventListener('keydown',e=>{const delta={ArrowLeft:[60,0],ArrowRight:[-60,0],ArrowUp:[0,60],ArrowDown:[0,-60]}[e.key];if(delta){e.preventDefault();tx+=delta[0];ty+=delta[1];paint();}});
document.querySelector('#reset').onclick=()=>setZoom(Math.min(VW/L.canvas.width,VH/L.canvas.height));document.querySelector('#zoom').onclick=()=>setZoom(1.15);
zoom=1.15;tx=-160;ty=-330;paint();
document.querySelector('#map').onerror=()=>{const e=document.querySelector('#error');e.style.display='block';e.textContent='배경을 불러오지 못했습니다. ZIP 전체를 풀고 reference.html을 열어 주세요.'};
</script></html>
