<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" shape-rendering="crispEdges">
  <title>Old inn plan with later retrofit annotations — schematic review proposal</title>
  <desc>Two separate level diagrams, not a measured architectural plan. Grey marks are the old laundry and service stair relationship. Red annotations link the kitchen lever to the room bookcase lower latch. No route dimensions or user identity are established.</desc>
  <rect width="1600" height="900" fill="#5c392b"/>
  <path fill="#6b4331" d="M0 48H800V68H0ZM960 0H1600V32H960ZM0 828H1600V860H0ZM32 120H60V764H32ZM1536 100H1572V800H1536Z"/>
