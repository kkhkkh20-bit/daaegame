  <!-- Fresh repair paper is intentionally a single unlabelled patch. -->
  <path fill="#bea986" d="M472 512H572V564H472Z"/>
  <path fill="#f5ecd3" d="M464 504H564V556H464Z"/>
  <path fill="#daceb2" d="M548 504H564V520H548Z"/>
