  <g fill="none" stroke="#a1493c" stroke-width="8" stroke-linejoin="miter" stroke-linecap="square">
    <path d="M520 516V536H540 M520 536H500"/>
    <path d="M520 536V692H768 M800 692H1048 M1080 692H1392V492H1316"/>
