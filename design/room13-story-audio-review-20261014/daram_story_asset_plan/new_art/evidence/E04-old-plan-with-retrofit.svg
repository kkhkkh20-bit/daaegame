  <path fill="#ddc9a6" d="M784 96H796V776H784ZM108 432H1456V444H108ZM120 756H320V776H120ZM1368 96H1456V116H1368Z"/>
  <path fill="#f0e2c5" d="M800 96H808V776H800ZM108 448H1456V456H108Z"/>
  <!-- Old plan, left level: kitchen, laundry, service stairs. All dark-grey lines are original. -->
  <g fill="none" stroke="#67645b" stroke-width="8" stroke-linejoin="miter" stroke-linecap="square">
    <path d="M156 208H740V596H156ZM156 292H256M320 292H376M456 292H596M596 208V232M596 288V596M156 556H256M336 556H376V292M456 292V420M456 480V596"/>
    <path d="M376 208V240M376 276V292"/>
    <path d="M636 252H716V356H636Z M636 268H716 M636 284H716 M636 300H716 M636 316H716 M636 332H716"/>
    <!-- Laundry tub and folded linen icon, no words. -->
    <path d="M204 416H320V488H204Z M216 396H308V416 M224 380H300V396 M228 488V504 M300 488V504"/>
    <path d="M216 440H308"/>
    <!-- Kitchen counter and stove/pot icon. -->
    <path d="M492 364H560V496H492Z M492 436H560 M508 380H544V412H508Z M500 380H552 M512 368H540 M520 356H532"/>
    <path d="M520 468H536V484H520Z"/>
  </g>
  <!-- Door openings and old circulation remain grey; the two levels are not a single shared scale. -->
  <g fill="none" stroke="#898274" stroke-width="4">
    <path d="M256 556V504H308V556M256 292V240H308V292M376 240H412V276H376M456 420H504V468H456M596 232H636V276H596"/>
  </g>
  <!-- Right level: window on left outer wall, bed and bookcase at right; front door at corridor end. -->
  <g fill="none" stroke="#67645b" stroke-width="8" stroke-linecap="square">
    <path d="M868 208H1436V596H1388M868 208V288M868 360V524H988M1060 524H1316V208M1340 208V596M988 524V628H868M1060 524V672H868"/>
    <path d="M868 288H852V360H868 M860 292V356"/>
    <!-- Bed, oriented within the right half of the room. -->
    <path d="M1136 264H1268V440H1136Z M1136 300H1268 M1148 276H1192V292H1148Z M1212 276H1256V292H1212Z"/>
    <!-- Bookshelf on right room wall, lower access/lock shown separately below. -->
    <path d="M1276 456H1308V508H1276Z M1284 456V480 M1296 456V480 M1276 484H1308"/>
    <!-- Stair and narrow old service void on the far side of the bookcase wall. -->
    <path d="M1356 252H1420V364H1356Z M1356 268H1420 M1356 284H1420 M1356 300H1420 M1356 316H1420 M1356 332H1420 M1356 348H1420"/>
