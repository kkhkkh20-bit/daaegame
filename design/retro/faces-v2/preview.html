<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>다람탐정 표정 v2 검수</title><style>body{background:#18212d;color:#f4efe4;font:16px system-ui;margin:24px}h1{font-size:24px}button{padding:9px 16px}table{border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid #415166;text-align:center}img{width:96px;height:96px;image-rendering:pixelated;background:repeating-conic-gradient(#334458 0% 25%,#2a394b 0% 50%) 50%/12px 12px}body.large img{width:192px;height:192px}small{color:#bccad7}section{overflow:auto}.sample{display:flex;gap:12px;align-items:center;padding:10px;background:#263447;max-width:560px;margin:12px 0}.sample p{flex:1}</style><h1>다람탐정 · 표정 v2</h1><p>입 움직임 없이 대사에 맞춰 정지 표정이 전환됩니다. 기존 기본 얼굴과 새 감정 얼굴을 함께 비교하세요.</p><button onclick="document.body.classList.toggle('large')">96px / 192px 전환</button><div id="samples"></div><section><table><thead><tr><th>캐릭터</th><th>기본</th><th>웃음</th><th>당황·땀</th><th>놀람</th><th>분노 / 할머니 슬픔</th></tr></thead><tbody id="rows"></tbody></table></section><p><small>곰·사서 선생님은 기본·생각도 새 도트로 제작했습니다. 할머니의 분노 대사는 당황으로, 슬픔·울음은 눈물 얼굴로 표시합니다. 검은 망토는 얼굴을 공개하지 않습니다. 생성형 이미지의 도트 스타일로, 엄격한 정수 픽셀 격자 원화는 아닙니다. 실제 게임 플레이 검수는 별도로 필요합니다.</small></p><script>const roster=[{"key": "det1", "src": "design/retro/daram-face/neutral.png"}, {"key": "badook", "src": "design/retro/faces/badook-neutral.png"}, {"key": "bami", "src": "design/retro/faces/bami-neutral.png"}, {"key": "bori", "src": "design/retro/faces/bori-neutral.png"}, {"key": "buri", "src": "design/retro/faces/buri-neutral.png"}, {"key": "doto", "src": "design/retro/faces/doto-neutral.png"}, {"key": "eunho", "src": "design/retro/faces/eunho-neutral.png"}, {"key": "grandma", "src": "design/retro/faces/grandma-neutral.png"}, {"key": "guseul", "src": "design/retro/faces/guseul-neutral.png"}, {"key": "karo", "src": "design/retro/faces/karo-neutral.png"}, {"key": "kkwak", "src": "design/retro/faces/kkwak-neutral.png"}, {"key": "kongi", "src": "design/retro/faces/kongi-neutral.png"}, {"key": "lamplighter", "src": "design/retro/faces/lamplighter-neutral.png"}, {"key": "luka", "src": "design/retro/faces/luka-neutral.png"}, {"key": "madam", "src": "design/retro/faces/madam-neutral.png"}, {"key": "mom", "src": "design/retro/faces/mom-neutral.png"}, {"key": "momo", "src": "design/retro/faces/momo-neutral.png"}, {"key": "mungchi", "src": "design/retro/faces/mungchi-neutral.png"}, {"key": "musoe", "src": "design/retro/faces/musoe-neutral.png"}, {"key": "nabi", "src": "design/retro/faces/nabi-neutral.png"}, {"key": "nero", "src": "design/retro/faces/nero-neutral.png"}, {"key": "nubi", "src": "design/retro/faces/nubi-neutral.png"}, {"key": "owlgp", "src": "design/retro/faces/owlgp-neutral.png"}, {"key": "papa", "src": "design/retro/faces/papa-neutral.png"}, {"key": "piko", "src": "design/retro/faces/piko-neutral.png"}, {"key": "ppul", "src": "design/retro/faces/ppul-neutral.png"}, {"key": "rei", "src": "design/retro/faces/rei-neutral.png"}, {"key": "seol", "src": "design/retro/faces/seol-neutral.png"}, {"key": "seori", "src": "design/retro/faces/seori-neutral.png"}, {"key": "shadow", "src": "design/retro/faces/shadow-neutral.png"}, {"key": "siluk", "src": "design/retro/faces/siluk-neutral.png"}, {"key": "sling", "src": "design/retro/faces/sling-neutral.png"}, {"key": "somi", "src": "design/retro/faces/somi-neutral.png"}, {"key": "tok", "src": "design/retro/faces/tok-neutral.png"}, {"key": "tori", "src": "design/retro/faces/tori-neutral.png"}, {"key": "ttadak", "src": "design/retro/faces/ttadak-neutral.png"}, {"key": "ubak", "src": "design/retro/faces/ubak-neutral.png"}, {"key": "wanggu", "src": "design/retro/faces/wanggu-neutral.png"}, {"key": "yeoni", "src": "design/retro/faces/yeoni-neutral.png"}, {"key": "teacher"}, {"key": "librarian"}];function image(k,m){return '<img alt="'+k+' '+m+'" src="../../../art/'+(m==='neutral'&&!['teacher','librarian'].includes(k)?'faces/':'faces-v2/')+k+'-'+m+'.png">'}document.querySelector('#rows').innerHTML=roster.map(r=>'<tr><th>'+r.key+'</th>'+['neutral','happy','nervous','shock',r.key==='grandma'?'sad':'angry'].map(m=>'<td>'+image(r.key,m)+'</td>').join('')+'</tr>').join('');document.querySelector('#samples').innerHTML=[['det1','happy','헤헤! 단서를 찾았어요!'],['rei','nervous','저, 저는… 그게…'],['karo','shock','헉! 뭐라고?!'],['wanggu','angry','이건 정말 화가 나는군!']].map(a=>'<div class="sample">'+image(a[0],a[1])+'<p>'+a[2]+'</p></div>').join('');</script></html>
