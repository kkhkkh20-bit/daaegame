<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>다람탐정 · 리소스 도감</title><link rel="stylesheet" href="style.css"><script src="app.js" defer></script></head><body>
<header><div class="brand">다람탐정 <span>RESOURCE ATLAS</span></div><h1>게임을 이루는 얼굴과 소리</h1><p>실제 저장소 연결을 살펴보는 읽기 전용 도감</p><div class="version"><span id="version">데이터를 불러오는 중…</span><button id="refresh">새 버전 확인</button></div><p class="notice">선택 보드와 별개입니다. 여기서 게임에 적용하거나 수정하지 않습니다. 조건부 호출은 실제 플레이에서 등장했음을 보장하지 않습니다.</p></header>
<main><nav aria-label="리소스 종류"><button data-tab="characters" aria-pressed="true">캐릭터</button><button data-tab="places" aria-pressed="false">장소별 배치</button><button data-tab="audio" aria-pressed="false">음향</button><button data-tab="audit" aria-pressed="false">연결 점검</button></nav>
<section class="filters" aria-label="필터"><label>검색<input id="query" type="search" placeholder="이름, ID, 포즈, 음원 경로"></label><label>장소<select id="place"><option value="">전체 장소</option></select></label><label>연결 상태<select id="status"><option value="">전체 상태</option><option value="conditional_call">활성 호출 근거 · 조건부</option><option value="registered">등록됨</option><option value="generated">생성됨</option><option value="missing">파일 누락</option></select></label><label>날짜<select id="day"><option value="">1–14일 전체</option></select></label><label>시간대<select id="period"><option value="">전체 시간대</option><option value="0">오전</option><option value="1">오후</option><option value="2">저녁</option></select></label></section>
<p id="summary" role="status" aria-live="polite"></p><div id="content"></div></main>
<dialog id="detail" aria-labelledby="detail-title"><div class="modal-head"><h2 id="detail-title"></h2><button id="close" aria-label="상세 닫기">닫기 ×</button></div><div id="detail-body"></div></dialog>
<footer>게임 소스 → 자동 추출 → 조회 도감 · 데이터 확인은 배포된 저장소 버전을 기준으로 합니다.</footer>
</body></html>
